name: Mirthsync CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: actions/cache@v4
      id: cache-mirthsync
      with:
        path: mirthsync-3.9.0.tar.gz
        key: ${{ runner.os }}-mirthsync-3.9.0.tar.gz

    - name: Download mirthSync
      if: steps.cache-mirthsync.outputs.cache-hit != 'true'
      run:
        curl -L -O https://github.com/SagaHealthcareIT/mirthsync/releases/download/3.9.0/mirthsync-3.9.0.tar.gz &&
        echo 'c17afe0ff64fcf5ed327c3346ab542144ef42477ea1346969775c6d175d3ae10  mirthsync-3.9.0.tar.gz' | sha256sum -c

    - name: Unpack mirthSync
      run:
        tar -xvzf mirthsync-3.9.0.tar.gz -C /opt &&
        ln -s /opt/mirthsync-3.9.0/bin/mirthsync.sh /usr/local/bin/mirthsync.sh

    - name: mirthSync push
      run: STAGE_URL=${{ secrets.STAGE_URL }} STAGE_USER=${{ secrets.STAGE_USER }} STAGE_PASS=${{ secrets.STAGE_PASS }} make push-remote
